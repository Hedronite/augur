name: release

# A tag push builds, attests and publishes a release. A manual run (workflow
# dispatch) is a dry run: it builds the same files and uploads them as a
# workflow artifact, and creates no release and no attestation.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build as a dry run, as a tag (CHANGELOG.md needs its section)'
        required: true
        default: v0.1.1

permissions:
  contents: read

env:
  # The exact Go toolchain every release is built with. It is recorded in the
  # release notes; rebuilding with another patch release gives other bytes.
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check the toolchain and the version
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      - name: A release tag must be on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Release notes from CHANGELOG.md
        run: |
          mkdir staging
          {
            scripts/release-notes.sh "$VERSION"
            printf '\n---\n\nBuilt with Go %s. Verify with the steps in docs/release.md:\n\n' "$GO_VERSION"
            printf -- '- checksums: `sha256sum -c SHA256SUMS --ignore-missing`\n'
            printf -- '- provenance: `gh attestation verify <file> --repo %s`\n' "$GITHUB_REPOSITORY"
          } > staging/RELEASE_NOTES.md
      - name: Build tarballs and checksums
        run: scripts/release.sh "$VERSION" dist
      - name: Install cyclonedx-gomod (version and module checksum pinned in the script)
        run: |
          scripts/install-cyclonedx.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: SBOMs, each checked against its binary
        run: scripts/sbom.sh "$VERSION" dist
      - name: Stage the release files
        run: cp dist/augur_*.tar.gz dist/augur_*.sbom.cdx.json dist/SHA256SUMS staging/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'push' && 'release-assets' || 'release-dry-run' }}
          path: staging/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staging/
      - name: Provenance for every tarball and for SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            staging/augur_*.tar.gz
            staging/SHA256SUMS
      - name: SBOM attestation, linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: staging/augur_${{ env.VERSION }}_linux_amd64.tar.gz
          sbom-path: staging/augur_${{ env.VERSION }}_linux_amd64.sbom.cdx.json
      - name: SBOM attestation, linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: staging/augur_${{ env.VERSION }}_linux_arm64.tar.gz
          sbom-path: staging/augur_${{ env.VERSION }}_linux_arm64.sbom.cdx.json
      - name: SBOM attestation, darwin/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: staging/augur_${{ env.VERSION }}_darwin_amd64.tar.gz
          sbom-path: staging/augur_${{ env.VERSION }}_darwin_amd64.sbom.cdx.json
      - name: SBOM attestation, darwin/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: staging/augur_${{ env.VERSION }}_darwin_arm64.tar.gz
          sbom-path: staging/augur_${{ env.VERSION }}_darwin_arm64.sbom.cdx.json
      - name: Create the release
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --notes-file staging/RELEASE_NOTES.md \
            staging/augur_*.tar.gz staging/augur_*.sbom.cdx.json staging/SHA256SUMS
